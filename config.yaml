app:
  data_dir: ~/.voice_time
  name: TimeBrief
audio:
  channels: 1
  sample_rate: 16000
export:
  date_format: '%Y-%m-%d'
  format: csv
  time_format: '%H:%M'
matching:
  ambiguity_threshold: 0.9
  confidence_threshold: 0.7
ollama:
  host: http://localhost:11434
  model: qwen2.5:3b-instruct
  timeout: 30
temporal:
  lunch_end: '13:30'
  lunch_start: '12:30'
  working_day_end: '18:00'
  working_day_start: 09:00
whisper:
  device: cpu
  model: medium.en

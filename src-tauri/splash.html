<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TimeBrief</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .logo {
            width: 120px;
            height: 120px;
            margin-bottom: 30px;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .logo img {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 150, 255, 0.3);
        }
        
        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        
        .tagline {
            color: #64b5f6;
            font-size: 1rem;
            margin-bottom: 50px;
        }
        
        .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #64b5f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        .status {
            font-size: 0.9rem;
            color: #90caf9;
            animation: fade 1.5s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes fade {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        
        .dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }
        
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }
    </style>
</head>
<body>
    <div class="logo">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="100" height="100" rx="20" fill="#1e3a5f"/>
            <circle cx="50" cy="50" r="35" stroke="#64b5f6" stroke-width="3" fill="none"/>
            <path d="M50 25 L50 50 L70 60" stroke="#64b5f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="50" cy="50" r="5" fill="#64b5f6"/>
            <path d="M30 75 Q35 70 40 75 Q45 80 50 75 Q55 70 60 75 Q65 80 70 75" stroke="#90caf9" stroke-width="2" fill="none" opacity="0.6"/>
        </svg>
    </div>
    
    <h1>TimeBrief</h1>
    <p class="tagline">Voice-Powered Legal Time Tracking</p>
    
    <div class="loader">
        <div class="spinner"></div>
        <p class="status">Setting up AI models<span class="dots"></span></p>
    </div>
</body>
</html>
